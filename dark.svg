  <circle cx="50" cy="45" r="6" fill="#ef4444" />
  <circle cx="70" cy="45" r="6" fill="#f59e0b" />
  <circle cx="90" cy="45" r="6" fill="#10b981" />

  <text x="120" y="49" class="text-mono" font-size="12" fill="#64748b" font-weight="500">core@terminal: ~/architect/weranganimsara</text>
  <rect x="1000" y="34" width="136" height="22" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
