    <line x1="220" y1="0" x2="220" y2="610" />
    <line x1="360" y1="0" x2="360" y2="610" />
    <line x1="500" y1="0" x2="500" y2="610" />
    <line x1="640" y1="0" x2="640" y2="610" />
    <line x1="780" y1="0" x2="780" y2="610" />
    <line x1="920" y1="0" x2="920" y2="610" />
    <line x1="1060" y1="0" x2="1060" y2="610" />

    <line x1="0" y1="80" x2="1180" y2="80" />
    <line x1="0" y1="200" x2="1180" y2="200" />
    <line x1="0" y1="320" x2="1180" y2="320" />
    <line x1="0" y1="440" x2="1180" y2="440" />
    <line x1="0" y1="560" x2="1180" y2="560" />
