    <text x="44" y="145">╔═════════════════════════════════════════════╗</text>
    <text x="44" y="162">║  [SYS_ID]  : W-NIMSARA-07                    ║</text>
    <text x="44" y="179">║  [ORIGIN]  : LK // ASIA-SOUTH-1              ║</text>
    <text x="44" y="196">║  [STATUS]  : FULL-STACK &amp; NETWORK ARCHITECT  ║</text>
