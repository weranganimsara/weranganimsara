<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="badgeGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="30" cy="30" r="0.8" fill="#0284c7" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes blinkLight {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanlineLight {
      0% { transform: translateY(0px); }
      100% { transform: translateY(160px); }
    }
    .cursor-blink-light { animation: blinkLight 1s infinite; }
    .scan-line-light { animation: scanlineLight 4s linear infinite; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1178" height="608" rx="20" ry="20" fill="url(#bgGradLight)" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Subtle Grid Background -->
  <rect x="1" y="1" width="1178" height="608" rx="20" ry="20" fill="url(#gridLight)" />

  <!-- Ambient Light Accents -->
  <circle cx="180" cy="140" r="180" fill="#38bdf8" fill-opacity="0.1" />
  <circle cx="980" cy="460" r="200" fill="#818cf8" fill-opacity="0.1" />

  <!-- ================= TOP WINDOW CONTROLS ================= -->
