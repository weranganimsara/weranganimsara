  <rect x="1" y="22" width="1178" height="20" fill="#ffffff" fill-opacity="0.9" />
  <line x1="1" y1="42" x2="1179" y2="42" stroke="#e2e8f0" stroke-width="1" />

  <!-- Window Buttons -->
