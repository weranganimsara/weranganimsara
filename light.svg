        <text x="0" y="124" fill="#334155" class="font-mono" font-size="11">║  ACCESS    : FULL PRIVILEGE [0x0] ║</text>
        <text x="0" y="142" fill="#0284c7" class="font-mono" font-size="11">╚═══════════════════════════════════╝</text>
      </g>
    </g>

