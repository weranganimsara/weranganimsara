      <g transform="translate(16, 26)">
        <text x="0" y="0" fill="#0284c7" class="font-mono" font-size="11" font-weight="700">user@wera-arch:~$</text>
        <text x="135" y="0" fill="#0f172a" class="font-mono" font-size="11">neofetch --brief</text>
        
        <text x="0" y="24" fill="#475569" class="font-mono" font-size="10.5">OS: Linux / Ubuntu / Cloud Core</text>
        <text x="0" y="44" fill="#475569" class="font-mono" font-size="10.5">Host: sghome.space [vServer]</text>
