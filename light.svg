      <rect x="480" y="0" width="150" height="32" rx="7" fill="url(#badgeGradLight)" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="496" cy="16" r="3.5" fill="#e11d48" />
      <text x="508" y="20" fill="#1e293b" class="font-mono" font-size="11" font-weight="600">UI/UX &amp; Creative</text>
    </g>

    <!-- Tech Stack Grid Section -->
    <g transform="translate(26, 212)">
      <!-- Panel Header -->
      <text x="0" y="0" fill="#475569" class="font-mono" font-size="11" font-weight="700" letter-spacing="0.5">TECHNICAL ARSENAL</text>
      <line x1="140" y1="-4" x2="630" y2="-4" stroke="#cbd5e1" stroke-width="1" />

      <!-- Row 1: Languages & Frontend -->
      <g transform="translate(0, 16)">
