<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light Mode Background Gradients -->
    <radialGradient id="lightBg" cx="20%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <radialGradient id="skyWash" cx="10%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoWash" cx="95%" cy="95%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lightBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="headerGradLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Styles & Animations -->
    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      @keyframes blinkLight {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-light { animation: blinkLight 1s infinite; }
      .live-pulse-light { animation: pulseLight 2.5s ease-in-out infinite; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, sans-serif; font-weight: 800; }
      .text-mono { font-family: "JetBrains Mono", "Fira Code", Consolas, Menlo, Monaco, monospace; }
      .text-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; }
    </style>
  </defs>

  <!-- Outer Frame with 24px radius -->
  <rect width="1180" height="610" rx="24" fill="url(#lightBg)" />
  <rect width="1180" height="610" rx="24" fill="url(#skyWash)" />
  <rect width="1180" height="610" rx="24" fill="url(#indigoWash)" />
  <rect x="0.5" y="0.5" width="1179" height="609" rx="23.5" stroke="url(#lightBorder)" stroke-width="1.2" />

  <!-- Subtle Grid Pattern -->
