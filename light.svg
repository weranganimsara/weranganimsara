  <circle cx="52" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="72" cy="21" r="6" fill="#27c93f" />

  <!-- Top Center Title Tab -->
  <rect x="440" y="8" width="300" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="456" cy="21" r="3.5" fill="#0284c7" />
  <text x="470" y="25" fill="#475569" class="font-mono" font-size="11" font-weight="600">wera@terminal: ~/identity.sys</text>

  <!-- Top Right Status Badge -->
  <rect x="1010" y="10" width="138" height="22" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <circle cx="1025" cy="21" r="3.5" fill="#059669" />
  <text x="1036" y="25" fill="#047857" class="font-mono" font-size="10.5" font-weight="600">STATUS: ACTIVE</text>

  <!-- ================= LEFT COLUMN: VISUAL / IDENTITY ================= -->
  <g transform="translate(32, 60)">
