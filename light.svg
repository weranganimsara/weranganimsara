      <!-- Matrix Dot Grid Avatar Graphic -->
      <g transform="translate(24, 20)">
        <text x="0" y="16" fill="#0284c7" class="font-mono" font-size="11" letter-spacing="1">╔═══════════════════════════════════╗</text>
        <text x="0" y="34" fill="#0284c7" class="font-mono" font-size="11">║   WERA Xx_xT  ::  CORE IDENTITY   ║</text>
        <text x="0" y="52" fill="#0284c7" class="font-mono" font-size="11">╠═══════════════════════════════════╣</text>
        <text x="0" y="70" fill="#334155" class="font-mono" font-size="11">║  NODE ID   : SG-HOME-PRIMARY      ║</text>
        <text x="0" y="88" fill="#334155" class="font-mono" font-size="11">║  LOCATION  : SRI LANKA [LK]       ║</text>
